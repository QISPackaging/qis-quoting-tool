name: Sync quotes from Unleashed

on:
  schedule:
   # Every 15 minutes - quotes created in Unleashed appear in the tool quickly
  - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: quote-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Sync quotes into the tool
        env:
          UNLEASHED_CONNECTOR_URL: ${{ secrets.UNLEASHED_CONNECTOR_URL }}
        run: python3 scripts/sync_unleashed_quotes.py
