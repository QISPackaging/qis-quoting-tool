name: Sync products from Unleashed

on:
  schedule:
    # 19:00 UTC = 5:00 AM Brisbane (AEST, UTC+10) - runs daily
    - cron: "0 19 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Diagnose connector endpoint
        env:
          URL: ${{ secrets.UNLEASHED_CONNECTOR_URL }}
        run: |
          echo "Secret URL length: ${#URL} characters"
          echo "Secret URL ends in: ...${URL: -6}"
          echo ""
          echo "--- GET request ---"
          curl -s -o /tmp/get.txt -w "GET status: %{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0" "$URL" || true
          echo "GET body (first 300 chars):"
          head -c 300 /tmp/get.txt; echo ""
          echo ""
          echo "--- POST initialize (MCP handshake) ---"
          curl -s -o /tmp/post.txt -w "POST status: %{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"diag","version":"1"}}}' \
            "$URL" || true
          echo "POST body (first 500 chars):"
          head -c 500 /tmp/post.txt; echo ""

      - name: Run product sync (via Unleashed connector)
        env:
          UNLEASHED_CONNECTOR_URL: ${{ secrets.UNLEASHED_CONNECTOR_URL }}
        run: python3 scripts/sync_unleashed_products.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qis_products.json
          if git diff --cached --quiet; then
            echo "No product changes today."
          else
            git commit -m "Auto-sync products from Unleashed"
            git push
          fi
